name: Render disk slider
on:
  workflow_dispatch:
    inputs:
      frame_rate:
        description: 'Frame rate (30 for first test, 60 for smoother motion)'
        required: true
        type: choice
        default: '30'
        options: ['30', '60']
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare video project
        run: |
          cat > package.json <<'PACKAGE_JSON'
          {"name":"decagon-video","version":"1.0.0","private":true,"scripts":{"studio":"remotion studio index.jsx","render":"remotion render disk_slider.jsx DiskSlider out/disk-slider.mp4 --codec=h264 --crf=18 --concurrency=2"},"dependencies":{"@fontsource/noto-sans-sc":"5.3.1","@remotion/cli":"4.0.538","react":"18.3.1","react-dom":"18.3.1","remotion":"4.0.538"}}
          PACKAGE_JSON
          cat > disk_slider.jsx <<'VIDEO_JSX'
          import React from 'react';
          import '@fontsource/noto-sans-sc/400.css';
          import {Composition,registerRoot,useCurrentFrame,useVideoConfig} from 'remotion';
          const ink='#202a34',blue='#276b9c',gray='#89939e';
          
          // 物理参数，国际单位制；theta0 用度，omega0 用 rad/s。
          const P={M:4,R:.50,m:1,k:80,l0:.20,kappa:2,r0:.20,rdot0:0,theta0:0,omega0:2,seconds:8};
          const I=.5*P.M*P.R**2;
          // m(r_dd-r*omega^2)=-k(r-l0)
          // (I+m*r^2)*theta_dd+2*m*r*r_dot*omega=-kappa*theta
          function integrate(){
           if([P.M,P.R,P.m,P.k,P.l0,P.kappa,P.seconds].some(v=>!Number.isFinite(v)||v<=0))throw Error('Physical parameters must be finite and positive.');
           const n=Math.ceil(P.seconds/.001),dt=P.seconds/n;
           const rhs=y=>{
            const[r,u,theta,w]=y;
            return [u,r*w*w-P.k/P.m*(r-P.l0),w,(-P.kappa*theta-2*P.m*r*u*w)/(I+P.m*r*r)];
           };
           const add=(y,k,h)=>y.map((v,j)=>v+h*k[j]);
           const states=[[P.r0,P.rdot0,P.theta0*Math.PI/180,P.omega0]];
           for(let i=0;i<n;i++){
            const y=states[i],a=rhs(y),b=rhs(add(y,a,dt/2)),c=rhs(add(y,b,dt/2)),d=rhs(add(y,c,dt));
            const next=y.map((v,j)=>v+dt*(a[j]+2*b[j]+2*c[j]+d[j])/6);
            if(next.some(v=>!Number.isFinite(v))||next[0]<=.025||next[0]>P.R-.055)throw Error('The slider reaches the slot boundary; change physical parameters or duration.');
            states.push(next);
           }
           return {dt,states};
          }
          const solution=integrate();
          function sample(t){
           const f=Math.max(0,Math.min(P.seconds,t))/solution.dt;
           const i=Math.min(solution.states.length-2,Math.floor(f)),u=Math.min(1,f-i);
           return solution.states[i].map((v,j)=>v*(1-u)+solution.states[i+1][j]*u);
          }
          const text=(x,y,s,size=22,extra={})=><text x={x} y={y} fill={ink} fontSize={size} {...extra}>{s}</text>;
          function Diagram(){
           const frame=useCurrentFrame(),{fps}=useVideoConfig();
           const videoTime=frame/fps,t=Math.min(P.seconds,Math.max(0,(videoTime-1.5)*P.seconds/21));
           const[r,u,theta,w]=sample(t);
           const cx=960,cy=605,R=285,scale=R/P.R,blockX=cx+r*scale;
           const point=(x,y)=>{const dx=x-cx,dy=y-cy;return [cx+dx*Math.cos(theta)+dy*Math.sin(theta),cy-dx*Math.sin(theta)+dy*Math.cos(theta)];};
           const blockCentre=point(blockX,cy),kLabel=point((cx+blockX)/2,cy-42),rLabel=point((cx+blockX)/2,cy+100);
           const coil=[[cx+15,cy],[cx+24,cy]],left=blockX-26;
           for(let i=0;i<12;i++)coil.push([cx+28+i*(left-cx-38)/11,cy+(i%2?-9:9)]);
           coil.push([left,cy]);
           // In screen coordinates: positive physical rotation is counterclockwise.
           const omegaPath=w>=0?`M${cx-164} ${cy-166} A233 233 0 0 0 ${cx-232} ${cy+20}`:`M${cx-232} ${cy+20} A233 233 0 0 1 ${cx-164} ${cy-166}`;
           const torquePath=theta>=0?`M${cx-42} ${cy+40} A58 58 0 0 1 ${cx-42} ${cy-40}`:`M${cx-42} ${cy-40} A58 58 0 0 0 ${cx-42} ${cy+40}`;
           return <svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style={{background:'white',fontFamily:'Noto Sans SC,sans-serif'}}>
           <defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill={blue}/></marker></defs>
           {text(960,72,'转盘与径向滑块',35,{textAnchor:'middle',letterSpacing:3})}
           {text(960,108,'二维等效示意 · 俯视',16,{textAnchor:'middle',fill:gray,letterSpacing:2})}
           {[[440,'径向位置 r',r.toFixed(3),'m'],[785,'转盘转角 θ',(theta*180/Math.PI).toFixed(2),'°'],[1135,'角速度 ω',w.toFixed(2),'rad/s'],[1480,'物理时间 t',t.toFixed(2),'s']].map(([x,label,value,unit])=><g key={label}>{text(x,174,label,19,{textAnchor:'middle',fill:gray})}<text x={x} y="222" fill={blue} fontSize="34" textAnchor="middle">{value}<tspan dx="8" fontSize="17" fill="#647180">{unit}</tspan></text></g>)}
           {text(960,267,`M = ${P.M} kg    ·    R = ${P.R.toFixed(2)} m    ·    m = ${P.m} kg    ·    k = ${P.k} N/m    ·    κ = ${P.kappa} N·m/rad`,17,{textAnchor:'middle',fill:gray})}
           <circle cx={cx} cy={cy} r={R} stroke={ink} strokeWidth="2" fill="white"/>
           {/* The groove, spring, slider and dimension line rotate with the disk. */}
           <g transform={`rotate(${-theta*180/Math.PI} ${cx} ${cy})`}>
            <path d={`M${cx+13} ${cy-30} H${cx+R-23} M${cx+13} ${cy+30} H${cx+R-23}`} fill="none" stroke="#adb7c1" strokeWidth="1.2"/>
            <path d={`M${cx+R-23} ${cy-30} V${cy+30}`} stroke="#adb7c1" strokeWidth="1.2"/>
            <polyline points={coil.map(p=>p.join(',')).join(' ')} stroke={ink} strokeWidth="2" fill="none" strokeLinejoin="round"/>
            <rect x={blockX-26} y={cy-26} width="52" height="52" stroke={ink} strokeWidth="2" fill="white"/>
            <path d={`M${cx} ${cy+66} V${cy+84} M${blockX} ${cy+66} V${cy+84} M${cx} ${cy+75} H${blockX}`} stroke={blue} strokeWidth="1.2" fill="none"/>
           </g>
           {/* Keep text upright while following the moving components. */}
           {text(blockCentre[0],blockCentre[1]+8,'m',24,{textAnchor:'middle',fill:blue})}
           {text(kLabel[0],kLabel[1],'k',22,{textAnchor:'middle',fill:blue})}
           {text(rLabel[0],rLabel[1],'r',22,{textAnchor:'middle',fill:blue})}
           <circle cx={cx} cy={cy} r="11" fill="white" stroke={ink} strokeWidth="2"/>
           <circle cx={cx} cy={cy} r="3" fill={ink}/>
           {text(cx-23,cy+27,'O',22)}
           {/* An upper semicircle separates torque cues from the moving slot. */}
           {Math.abs(theta)>.015&&<path d={torquePath} fill="none" stroke={blue} strokeWidth="1.6" opacity={Math.min(1,Math.abs(theta)*3)} markerEnd="url(#arrow)"/>}
           {text(cx-92,cy-48,'−κθ',22,{fill:blue,textAnchor:'middle'})}
           {Math.abs(w)>.015&&<path d={omegaPath} fill="none" stroke={blue} strokeWidth="1.6" opacity={Math.min(1,.25+Math.abs(w)*.4)} markerEnd="url(#arrow)"/>}
           {text(cx-226,cy-125,'ω',24,{fill:blue})}
           {text(960,981,'圆心轴固定 · 转盘可转动 · 滑块沿槽移动',17,{textAnchor:'middle',fill:gray})}
           {text(960,1021,videoTime<1.5?'初始构型 · 轴下扭簧以回复力矩 −κθ 表示':'轴下扭簧以回复力矩 −κθ 表示 · 慢放 × 0.381',16,{textAnchor:'middle',fill:gray})}
           </svg>;
          }
          registerRoot(()=> <Composition id="DiskSlider" component={Diagram} width={1920} height={1080} fps={30} durationInFrames={24*30}/>);
          VIDEO_JSX
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx remotion browser ensure
      - name: Render MP4
        env:
          VIDEO_FPS: ${{ inputs.frame_rate }}
        run: npx remotion render disk_slider.jsx DiskSlider out/disk-slider.mp4 --codec=h264 --crf=18 --concurrency=2 --fps="$VIDEO_FPS" --duration="$((24 * VIDEO_FPS))"
      - name: Downloadable video
        uses: actions/upload-artifact@v4
        with:
          name: disk-slider-${{ inputs.frame_rate }}fps
          path: out/disk-slider.mp4
          retention-days: 3
          if-no-files-found: error
