           [14,'构造黄金分割长度','以M为圆心、MT为半径画圆，得到N'],
           [20,'沿圆截取等弦','固定长度 ON，依次截取十个顶点'],
           [35,'正十边形完成','十条等弦闭合，连接得到正十边形'],
