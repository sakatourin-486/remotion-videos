name: Render video
on:
  workflow_dispatch:
    inputs:
      frame_rate:
        description: 'Frame rate (30 for first test, 60 for smoother motion)'
        required: true
        type: choice
        default: '30'
        options: ['30', '60']
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare video project
        run: |
          cat > package.json <<'PACKAGE_JSON'
          {"name":"decagon-video","version":"1.0.0","private":true,"scripts":{"studio":"remotion studio index.jsx","render":"remotion render index.jsx Decagon out/decagon.mp4 --codec=h264 --crf=18 --concurrency=2"},"dependencies":{"@fontsource/noto-sans-sc":"5.3.1","@remotion/cli":"4.0.538","react":"18.3.1","react-dom":"18.3.1","remotion":"4.0.538"}}
          PACKAGE_JSON
          cat > index.jsx <<'VIDEO_JSX'
          import React from 'react';
          import '@fontsource/noto-sans-sc/400.css';
          import {AbsoluteFill, Composition, registerRoot, useCurrentFrame, useVideoConfig} from 'remotion';
          
          // 修改颜色、节奏与字号可从这里开始。几何长度均由尺规交点计算。
          const THEME={background:'#0c1017',ink:'#e7ecf4',yellow:'#ffdf4d',blue:'#70cedc',muted:'#99a6ba'};
          const O=[600,560], R=220;
          const A=[O[0]+R,O[1]], B=[O[0]-R,O[1]], T=[O[0],O[1]-R];
          const M=[O[0]+R/2,O[1]], MT=Math.sqrt(5)*R/2;
          const N=[M[0]-MT,O[1]], SIDE=O[0]-N[0];
          const angle=2*Math.asin(SIDE/(2*R));
          const points=Array.from({length:10},(_,i)=>[O[0]+R*Math.cos(i*angle),O[1]-R*Math.sin(i*angle)]);
          const clamp=(x)=>Math.max(0,Math.min(1,x));
          const ease=(x)=>{x=clamp(x);return x*x*(3-2*x);};
          const lerp=(a,b,p)=>a+(b-a)*p;
          const at=(c,r,a)=>[c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)];
          const bearing=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
          const interval=(t,start,duration)=>ease((t-start)/duration);
          const tx={fontFamily:'"Noto Sans CJK SC","Noto Sans SC",sans-serif',fill:THEME.ink};
          
          function Segment({a,b,p=1,color=THEME.ink,width=2,opacity=1}) {
           if(p<=0)return null;
           return <line x1={a[0]} y1={a[1]} x2={lerp(a[0],b[0],p)} y2={lerp(a[1],b[1],p)} stroke={color} strokeWidth={width} opacity={opacity} strokeLinecap="round"/>;
          }
          function Dot({p,label,offset=[0,-21],color=THEME.ink,opacity=1}){
           return <g opacity={opacity}><circle cx={p[0]} cy={p[1]} r={5} fill={color}/>{label&&<text x={p[0]+offset[0]} y={p[1]+offset[1]} textAnchor="middle" fontSize={26} fill={color}>{label}</text>}</g>;
          }
          // 半径和弧线都由同一个帧进度驱动，拖动时间轴或云端并行渲染也保持同步。
          function Sweep({center,radius,start=0,span=2*Math.PI,t,begin,duration=2,color=THEME.blue,opacity=1,width=2.4}){
           if(t<begin)return null;
           const progress=interval(t,begin,duration);
           const sweep=span*progress;
           const end=at(center,radius,start+sweep);
           const startPoint=at(center,radius,start);
           let d='';
           if(progress>0){
            if(Math.abs(sweep)>=2*Math.PI-1e-7){
             const mid=at(center,radius,start+span/2);
             const flag=span>0?1:0;
             d=`M ${startPoint} A ${radius} ${radius} 0 1 ${flag} ${mid} A ${radius} ${radius} 0 1 ${flag} ${startPoint}`;
            }else d=`M ${startPoint} A ${radius} ${radius} 0 ${Math.abs(sweep)>Math.PI?1:0} ${span>0?1:0} ${end}`;
           }
           const radialOpacity=1-interval(t,begin+duration,0.22);
           return <g opacity={opacity}>
            {d&&<path d={d} fill="none" stroke={color} strokeWidth={width} strokeLinecap="round"/>}
            <g opacity={radialOpacity}><Segment a={center} b={end} color={THEME.blue} width={2}/><circle cx={end[0]} cy={end[1]} r={4} fill={THEME.blue}/><circle cx={center[0]} cy={center[1]} r={3} fill={THEME.blue}/></g>
           </g>;
          }
          const phases=[
           [0,'画圆与直径','以 O 为圆心、OA 为半径画圆'],
           [4,'作垂直直径','以 A、B 为圆心，取 AB 为半径作交弧'],
           [9,'平分半径 OA','作 OA 的垂直平分线，得到中点 M'],
           [14,'构造黄金分割长度','以 M 为圆心、MT 为半径画圆，得到 N'],
           [20,'沿圆截取等弦','固定长度 ON，依次截取十个顶点'],
           [35,'正十边形完成','十条等弦闭合，连接得到正十边形'],
          ];
          
          function Decagon(){
           const frame=useCurrentFrame(),{fps}=useVideoConfig();
           const t=frame/fps;
           const phase=phases.filter(([start])=>t>=start).at(-1);
           const phaseIndex=phases.indexOf(phase);
           const fadeAux=1-interval(t,34.6,1);
           const dim=1-0.76*interval(t,19,0.8);
           const located=1+Array.from({length:9},(_,i)=>20+i*1.45+0.85).filter(begin=>t>=begin).length;
           const final=interval(t,35,1);
           const H=[O[0],O[1]-Math.sqrt(3)*R],K=[O[0],O[1]+Math.sqrt(3)*R];
           const U=[M[0],O[1]-Math.sqrt(3)*R/2],V=[M[0],O[1]+Math.sqrt(3)*R/2];
           return <AbsoluteFill style={{backgroundColor:THEME.background}}><svg width="1920" height="1080" viewBox="0 0 1920 1080" style={tx}>
            <text x="960" y="100" textAnchor="middle" fontSize="44" letterSpacing="6">正十边形 · 尺规作图</text>
            <text x="960" y="150" textAnchor="middle" fontSize="22" fill={THEME.muted}>STRAIGHTEDGE &amp; COMPASS CONSTRUCTION</text>
            <Sweep center={O} radius={R} t={t} begin={0.6} duration={2.5} color={THEME.ink} width={3} opacity={1-final*0.6}/>
            <g opacity={fadeAux*dim}>
             <Segment a={[B[0]-45,B[1]]} b={[A[0]+120,A[1]]} p={interval(t,3.2,0.7)} color={THEME.muted}/>
             <Dot p={O} label="O" offset={[0,32]}/><Dot p={A} label="A" offset={[24,0]}/>
             {t>3.8&&<Dot p={B} label="B" offset={[-25,0]}/>}
             {[A,B].flatMap((center,i)=>[H,K].map((target,j)=><Sweep key={`perp${i}${j}`} center={center} radius={2*R} start={bearing(center,target)-0.16} span={0.32} t={t} begin={4.5+(i*2+j)*0.65} duration={0.55} color={THEME.muted} opacity={1-interval(t,8,0.6)}/>))}
             <Segment a={K} b={H} p={interval(t,7.3,0.8)} color={THEME.muted}/>
             {t>=8.1&&<Dot p={T} label="T"/>}
             {[O,A].flatMap((center,i)=>[U,V].map((target,j)=><Sweep key={`mid${i}${j}`} center={center} radius={R} start={bearing(center,target)-0.19} span={0.38} t={t} begin={9.3+(i*2+j)*0.65} duration={0.55} color={THEME.muted} opacity={1-interval(t,12.8,0.6)}/>))}
             <Segment a={[V[0],V[1]+35]} b={[U[0],U[1]-35]} p={interval(t,12,0.7)} color={THEME.muted}/>
             {t>=12.7&&<Dot p={M} label="M" offset={[0,34]}/>}
             <Segment a={M} b={T} p={interval(t,13,0.7)} color={THEME.blue}/>
             <Sweep center={M} radius={MT} start={bearing(M,T)} t={t} begin={14.6} duration={2.8}/>
             {t>=17.4&&<Dot p={N} label="N" color={THEME.yellow}/>}
            </g>
            <g opacity={fadeAux}><Segment a={O} b={N} p={interval(t,17.5,0.7)} color={THEME.yellow} width={5} opacity={1-0.6*interval(t,19,0.8)}/></g>
            {Array.from({length:10},(_,i)=>{
              const center=points[i],target=points[(i+1)%10],begin=20+i*1.45;
              return <g key={`step${i}`}>
               <Sweep center={center} radius={SIDE} start={bearing(center,target)-0.27} span={0.54} t={t} begin={begin} duration={0.85} color={THEME.blue} opacity={fadeAux*(1-0.7*interval(t,begin+1.05,0.25))}/>
               <Segment a={center} b={target} p={interval(t,begin+0.85,0.45)} width={4} color={THEME.yellow}/>
              </g>;
            })}
            {t>=20&&points.map((p,i)=>t>=20+(Math.max(0,i-1))*1.45+(i===0?0:0.85)&&<Dot key={`vertex${i}`} p={p} color={THEME.yellow}/>)}
            {final>0&&<polygon points={points.map(p=>p.join(',')).join(' ')} fill={THEME.yellow} fillOpacity={0.07*final} stroke="none"/>}
            <line x1="1130" y1="235" x2="1130" y2="880" stroke={THEME.muted} strokeOpacity="0.22"/>
            <g transform="translate(1220 280)">
             <text fontSize="24" fill={THEME.blue}>STEP {phaseIndex+1} / 6</text>
             <text y="64" fontSize="38" fill={phaseIndex===5?THEME.yellow:THEME.ink}>{phase[1]}</text>
             {phaseIndex<=1?<g fontSize="27" fill={THEME.muted}><text y="145">给定半径 R</text><text y="205">先构造两条垂直直径</text><text y="265">只使用直线与圆弧</text></g>:<g>
              <text y="145" fontSize="30">OM = R / 2</text>
              <text y="205" fontSize="30">MT² = R² + (R / 2)²</text>
              {t>=17.5&&<g opacity={interval(t,17.5,0.6)}><text y="285" fontSize="30">ON = MT − OM</text><text y="355" fontSize="34" fill={THEME.yellow}>s = (√5 − 1)R / 2</text></g>}
             </g>}
             {t>=20&&t<35&&<g><text y="465" fontSize="23" fill={THEME.muted}>已定位顶点</text><text y="535" fontSize="58" fill={THEME.yellow}>{located} / 10</text></g>}
             {t>=35&&<g><text y="465" fontSize="30">圆心角：36°</text><text y="525" fontSize="30">内角：144°</text></g>}
            </g>
            <text x="960" y="1020" textAnchor="middle" fontSize="30">{phase[2]}</text>
           </svg></AbsoluteFill>;
          }
          const Root=()=> <Composition id="Decagon" component={Decagon} width={1920} height={1080} fps={30} durationInFrames={40*30}/>;
          registerRoot(Root);
          
          VIDEO_JSX
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx remotion browser ensure
      - name: Render MP4
        env:
          VIDEO_FPS: ${{ inputs.frame_rate }}
        run: npx remotion render index.jsx Decagon out/decagon.mp4 --codec=h264 --crf=18 --concurrency=2 --fps="$VIDEO_FPS" --duration="$((40 * VIDEO_FPS))"
      - name: Downloadable video
        uses: actions/upload-artifact@v4
        with:
          name: decagon-video-${{ inputs.frame_rate }}fps
          path: out/decagon.mp4
          retention-days: 3
          if-no-files-found: error
