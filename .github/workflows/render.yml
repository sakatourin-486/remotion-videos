name: Render disk slider 3D
on:
  workflow_dispatch:
    inputs:
      frame_rate:
        description: 'Frame rate: 30, 60, or 120 fps'
        required: true
        type: choice
        default: '30'
        options: ['30', '60', '120']
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare video project
        run: |
          cat > package.json <<'PACKAGE_JSON'
          {"name":"decagon-video","version":"1.0.0","private":true,"scripts":{"studio":"remotion studio index.jsx","render":"remotion render disk_slider_3d.jsx DiskSlider3D out/disk-slider-3d.mp4 --codec=h264 --crf=18 --concurrency=2"},"dependencies":{"@fontsource/noto-sans-sc":"5.3.1","@remotion/cli":"4.0.538","react":"18.3.1","react-dom":"18.3.1","remotion":"4.0.538"}}
          PACKAGE_JSON
          cat > disk_slider_3d.jsx <<'VIDEO_JSX'
          import React from 'react';
          import '@fontsource/noto-sans-sc/400.css';
          import {Composition,registerRoot,useCurrentFrame,useVideoConfig} from 'remotion';
          const ink='#202a34',blue='#276b9c',gray='#89939e';
          // 物理参数，国际单位制；theta0 用度，omega0 用 rad/s。
          const P={M:4,R:.50,m:1,k:80,l0:.20,kappa:2,r0:.20,rdot0:0,theta0:0,omega0:2,seconds:8};
          const I=.5*P.M*P.R**2;
          // m(r_dd-r*omega^2)=-k(r-l0)
          // (I+m*r^2)*theta_dd+2*m*r*r_dot*omega=-kappa*theta
          function integrate(){
           if([P.M,P.R,P.m,P.k,P.l0,P.kappa,P.seconds].some(v=>!Number.isFinite(v)||v<=0))throw Error('Physical parameters must be finite and positive.');
           const n=Math.ceil(P.seconds/.001),dt=P.seconds/n;
           const rhs=y=>{
            const[r,u,theta,w]=y;
            return [u,r*w*w-P.k/P.m*(r-P.l0),w,(-P.kappa*theta-2*P.m*r*u*w)/(I+P.m*r*r)];
           };
           const add=(y,k,h)=>y.map((v,j)=>v+h*k[j]);
           const states=[[P.r0,P.rdot0,P.theta0*Math.PI/180,P.omega0]];
           for(let i=0;i<n;i++){
            const y=states[i],a=rhs(y),b=rhs(add(y,a,dt/2)),c=rhs(add(y,b,dt/2)),d=rhs(add(y,c,dt));
            const next=y.map((v,j)=>v+dt*(a[j]+2*b[j]+2*c[j]+d[j])/6);
            if(next.some(v=>!Number.isFinite(v))||next[0]<=.025||next[0]>P.R-.055)throw Error('The slider reaches the slot boundary; change physical parameters or duration.');
            states.push(next);
           }
           return {dt,states};
          }
          const solution=integrate();
          function sample(t){
           const f=Math.max(0,Math.min(P.seconds,t))/solution.dt;
           const i=Math.min(solution.states.length-2,Math.floor(f)),u=Math.min(1,f-i);
           return solution.states[i].map((v,j)=>v*(1-u)+solution.states[i+1][j]*u);
          }
          const beta=35*Math.PI/180,elev=22*Math.PI/180,S=800;
          const project=([x,y,z])=>[960+S*(Math.cos(beta)*x-Math.sin(beta)*y),460+S*(Math.sin(beta)*Math.sin(elev)*x+Math.cos(beta)*Math.sin(elev)*y-Math.cos(elev)*z)];
          const p=(x,y,z)=>project([x,y,z]);
          const path=(points,close=false)=>'M '+points.map(pt=>pt.join(',')).join(' L ')+(close?' Z':'');
          const circle=(r,z,start=0,end=2*Math.PI,n=150)=>Array.from({length:n+1},(_,i)=>{const a=start+(end-start)*i/n;return p(r*Math.cos(a),r*Math.sin(a),z);});
          const line=(a,b,props={})=><line x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke={ink} strokeWidth="1.8" strokeLinecap="round" {...props}/>;
          const text=(x,y,s,size=22,props={})=><text x={x} y={y} fill={ink} fontSize={size} {...props}>{s}</text>;
          function Cylinder({r,top,bottom,color='white',width=1.8}){
           const a=-beta,b=Math.PI-beta;
           const side=[...circle(r,top,a,b,80),...circle(r,bottom,b,a,80)];
           return <g><path d={path(side,true)} fill="#f5f7f9" stroke={ink} strokeWidth={width}/><path d={path(circle(r,top),true)} fill={color} stroke={ink} strokeWidth={width}/></g>;
          }
          
          // Local radial coordinates rotate with the disk. World geometry is projected
          // orthographically. Solids and coil back/front strokes preserve depth order.
          function turn([x,y,z],theta){return [x*Math.cos(theta)-y*Math.sin(theta),x*Math.sin(theta)+y*Math.cos(theta),z];}
          function Box({r,theta}){
           const x0=r-.045,x1=r+.045,y0=-.045,y1=.045,z0=.005,z1=.083;
           const faces=[
           {normal:[0,1,0],v:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],fill:'#f1f4f7'},
           {normal:[0,-1,0],v:[[x1,y0,z0],[x0,y0,z0],[x0,y0,z1],[x1,y0,z1]],fill:'#f1f4f7'},
           {normal:[1,0,0],v:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],fill:'#f8fafb'},
           {normal:[-1,0,0],v:[[x0,y1,z0],[x0,y0,z0],[x0,y0,z1],[x0,y1,z1]],fill:'#f8fafb'},
           {normal:[0,0,1],v:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],fill:'white'}];
           const view=[Math.sin(beta)*Math.cos(elev),Math.cos(beta)*Math.cos(elev),Math.sin(elev)];
           return <g>{faces.filter(f=>{const n=turn(f.normal,theta);return n.reduce((a,v,i)=>a+v*view[i],0)>1e-8;}).map((f,i)=><path key={i} d={path(f.v.map(v=>project(turn(v,theta))),true)} stroke={ink} strokeWidth="1.8" fill={f.fill}/>)}</g>;
          }
          function Scene(){
           const frame=useCurrentFrame(),{fps}=useVideoConfig();
           const videoTime=frame/fps,t=Math.min(P.seconds,Math.max(0,(videoTime-1.5)*P.seconds/21));
           const[r,u,theta,w]=sample(t);
           const q=(x,y,z)=>project(turn([x,y,z],theta));
           // One torsion-spring end rotates with the collar, the other stays fixed.
           const coil=[];
           for(let i=0;i<=500;i++){
            const f=i/500,a=theta*(1-f)+2*Math.PI*4.5*f,z=-.30-.19*f;
            coil.push({q:p(.064*Math.cos(a),.064*Math.sin(a),z),front:Math.sin(beta)*Math.cos(a)+Math.cos(beta)*Math.sin(a)>0});
           }
           const segments=front=>coil.slice(1).map((v,i)=>v.front===front?<path key={i} d={path([coil[i].q,v.q])} fill="none" stroke={ink} strokeWidth="2.4" strokeLinecap="round"/>:null);
           const spring=[q(.022,0,.025),q(.039,0,.025)],face=r-.045;
           for(let i=0;i<=140;i++){const a=2*Math.PI*5*i/140;spring.push(q(.045+(face-.054)*i/140,.015*Math.cos(a),.025+.015*Math.sin(a)));}
           spring.push(q(face,0,.025));
           const slot=[[.015,-.038,.001],[P.R-.035,-.038,.001],[P.R-.035,.038,.001],[.015,.038,.001]].map(v=>project(turn(v,theta)));
           const radiusA=q(0,.13,.006),radiusB=q(r,.13,.006);
           const kpoint=q((face+.022)/2,-.007,.039),kapoint=p(.064,0,-.40),massLabel=q(r,0,.088);
           const rotArrow=w>=0?circle(.36,.007,2.6,3.65,60):circle(.36,.007,3.65,2.6,60);
           return <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" style={{background:'white',fontFamily:'Noto Sans SC,sans-serif'}}>
           <defs><marker id="blueArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill={blue}/></marker><marker id="dimArrow" markerWidth="6" markerHeight="5" refX="3" refY="2.5" orient="auto-start-reverse"><path d="M6 0 L0 2.5 L6 5" fill="none" stroke={blue} strokeWidth="1"/></marker></defs>
           {text(960,72,'转盘上的径向振动',35,{textAnchor:'middle',letterSpacing:3})}
           {text(960,108,'ROTATING DISK  /  RADIAL SLIDER',14,{textAnchor:'middle',fill:gray,letterSpacing:3})}
           {[[430,'物理时间',t.toFixed(2),'s'],[785,'径向位置 r',r.toFixed(3),'m'],[1135,'转盘转角 θ',(theta*180/Math.PI).toFixed(2),'°'],[1480,'角速度 ω',w.toFixed(2),'rad/s']].map(([x,label,value,unit])=><g key={label}>{text(x,174,label,19,{textAnchor:'middle',fill:gray})}<text x={x} y="222" fill={blue} fontSize="34" textAnchor="middle">{value}<tspan dx="8" fontSize="17" fill="#647180">{unit}</tspan></text></g>)}
           {text(960,267,`M = ${P.M} kg    ·    m = ${P.m} kg    ·    k = ${P.k} N/m    ·    κ = ${P.kappa} N·m/rad`,17,{textAnchor:'middle',fill:gray})}
           <Cylinder r={.23} top={-.55} bottom={-.60}/>
           {line(p(-.16,0,-.55),p(-.16,0,-.49),{strokeWidth:4})}
           {segments(false)}
           <Cylinder r={.017} top={-.21} bottom={-.55}/>
           {segments(true)}
           {/* Top spring leg attaches to rotating shaft; bottom leg to the fixed post. */}
           {line(q(.064,0,-.30),q(.017,0,-.30),{strokeWidth:2.3})}
           {line(p(-.064,0,-.49),p(-.16,0,-.49),{strokeWidth:2.3})}
           <Cylinder r={.036} top={-.28} bottom={-.30}/>
           {line(q(.017,0,-.278),q(.035,0,-.278),{stroke:blue,strokeWidth:2})}
           {/* Draw the opaque disk after the hidden upper shaft. */}
           <Cylinder r={P.R} top={0} bottom={-.055}/>
           <path d={path(slot,true)} fill="#edf1f5" stroke={ink} strokeWidth="1.3"/>
           {line(q(.015,.027,-.004),q(P.R-.035,.027,-.004),{stroke:'#aab4bf',strokeWidth:1})}
           <path d={path(spring)} fill="none" stroke={ink} strokeWidth="2" strokeLinejoin="round"/>
           <Box r={r} theta={theta}/>
           <circle cx={p(0,0,.006)[0]} cy={p(0,0,.006)[1]} r="4" fill={blue}/>
           {text(p(0,0,.006)[0]-25,p(0,0,.006)[1]-10,'O',22)}
           {text(massLabel[0],massLabel[1]+7,'m',22,{textAnchor:'middle',fill:blue})}
           {line(radiusA,radiusB,{stroke:blue,strokeWidth:1.2,markerStart:'url(#dimArrow)',markerEnd:'url(#dimArrow)'})}
           {line(q(0,0,.006),q(0,.145,.006),{stroke:blue,strokeWidth:1})}
           {line(q(r,.045,.006),q(r,.145,.006),{stroke:blue,strokeWidth:1})}
           {text((radiusA[0]+radiusB[0])/2,(radiusA[1]+radiusB[1])/2-10,'r',22,{fill:blue,textAnchor:'middle'})}
           {Math.abs(w)>.015&&<path d={path(rotArrow)} fill="none" stroke={blue} strokeWidth="1.8" opacity={Math.min(1,.25+Math.abs(w)*.4)} markerEnd="url(#blueArrow)"/>}
           {text(p(.36*Math.cos(3.15),.36*Math.sin(3.15),.007)[0]-33,p(.36*Math.cos(3.15),.36*Math.sin(3.15),.007)[1]-13,'ω',24,{fill:blue})}
           {line(kpoint,[kpoint[0]-10,kpoint[1]-54],{stroke:'#8e9aa6',strokeWidth:1})}
           {text(kpoint[0]-10,kpoint[1]-65,'k',23,{fill:blue,textAnchor:'middle'})}
           {line(kapoint,[kapoint[0]+100,kapoint[1]-3],{stroke:'#8e9aa6',strokeWidth:1})}
           {text(kapoint[0]+113,kapoint[1]+4,'扭转弹簧 κ',21,{fill:blue})}
           {text(960,989,'固定底座',18,{textAnchor:'middle',fill:gray})}
           {text(960,1020,videoTime<1.5?'初始构型 · 滑块按质点建模 · 两自由度':'三维线稿 · 无摩擦、无阻尼 · 慢放 × 0.381',17,{textAnchor:'middle',fill:gray})}
           </svg>;
          }
          registerRoot(()=> <Composition id="DiskSlider3D" component={Scene} width={1920} height={1080} fps={30} durationInFrames={24*30}/>);
          VIDEO_JSX
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx remotion browser ensure
      - name: Render MP4
        env:
          VIDEO_FPS: ${{ inputs.frame_rate }}
        run: npx remotion render disk_slider_3d.jsx DiskSlider3D out/disk-slider-3d.mp4 --codec=h264 --crf=18 --concurrency=2 --fps="$VIDEO_FPS" --duration="$((24 * VIDEO_FPS))"
      - name: Downloadable video
        uses: actions/upload-artifact@v4
        with:
          name: disk-slider-3d-${{ inputs.frame_rate }}fps
          path: out/disk-slider-3d.mp4
          retention-days: 3
          if-no-files-found: error
