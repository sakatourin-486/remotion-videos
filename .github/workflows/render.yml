name: Render video
on:
  workflow_dispatch:
    inputs:
      frame_rate:
        description: 'Frame rate (30 for first test, 60 for smoother motion)'
        required: true
        type: choice
        default: '30'
        options: ['30', '60']
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare video project
        run: |
          cat > package.json <<'PACKAGE_JSON'
          {"name":"decagon-video","version":"1.0.0","private":true,"scripts":{"studio":"remotion studio index.jsx","render":"remotion render index.jsx Decagon out/decagon.mp4 --codec=h264 --crf=18 --concurrency=2"},"dependencies":{"@fontsource/noto-sans-sc":"5.3.1","@remotion/cli":"4.0.538","react":"18.3.1","react-dom":"18.3.1","remotion":"4.0.538"}}
          PACKAGE_JSON
          cat > index.jsx <<'VIDEO_JSX'
          import React from 'react';
          import '@fontsource/noto-sans-sc/400.css';
          import {AbsoluteFill, Composition, registerRoot, useCurrentFrame, useVideoConfig} from 'remotion';
          
          // 修改颜色、节奏与字号可从这里开始。几何长度均由尺规交点计算。
          const THEME={background:'#0c1017',ink:'#e7ecf4',yellow:'#ffdf4d',blue:'#70cedc',muted:'#99a6ba'};
          const O=[600,560], R=220;
