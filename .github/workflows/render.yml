{Array.from({长度：10}，(_，i)=>{
共nst中心=点[我]，目标=点[(i+1)%10]，开始=20+我*1.45；
返回<g键={'步骤${i}'}>
<扫描中心={中心}半径={一边}开始={方向(中心，目标)-0.27}跨度={0.54}t={t}开始={开始}持续时间={0.85}颜色={主题.蓝色}不透明度={fadeAux*(1-0.7*间隔(t，开始+1.05，0.25))}/>
