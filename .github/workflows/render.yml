          const M=[O[0]+R/2,O[1]], MT=Math.sqrt(5)*R/2;
          const N=[M[0]-MT,O[1]], SIDE=O[0]-N[0];
          const angle=2*Math.asin(SIDE/(2*R));
          const points=Array.from({length:10},(_,i)=>[O[0]+R*Math.cos(i*angle),O[1]-R*Math.sin(i*angle)]);
          const clamp=(x)=>Math.max(0,Math.min(1,x));
          const ease=(x)=>{x=clamp(x);return x*x*(3-2*x);};
          const lerp=(a,b,p)=>a+(b-a)*p;
          const at=(c,r,a)=>[c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)];
          const bearing=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
          const interval=(t,start,duration)=>ease((t-start)/duration);
          const tx={fontFamily:'"Noto Sans CJK SC","Noto Sans SC",sans-serif',fill:THEME.ink};
          
          function Segment({a,b,p=1,color=THEME.ink,width=2,opacity=1}) {
           if(p<=0)return null;
           return <line x1={a[0]} y1={a[1]} x2={lerp(a[0],b[0],p)} y2={lerp(a[1],b[1],p)} stroke={color} strokeWidth={width} opacity={opacity} strokeLinecap="round"/>;
          }
