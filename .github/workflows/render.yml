name: Render mechanics animation
on:
  workflow_dispatch:
    inputs:
      frame_rate:
        description: 'Frame rate: 120 fps'
        required: true
        type: choice
        default: '120'
        options: ['120']
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare video project
        run: |
          cat > package.json <<'PACKAGE_JSON'
          {"name":"decagon-video","version":"1.0.0","private":true,"scripts":{"studio":"remotion studio index.jsx","render":"remotion render mechanics.jsx Mechanics out/mechanics.mp4 --codec=h264 --crf=18 --concurrency=1"},"dependencies":{"@fontsource/noto-sans-sc":"5.3.1","@remotion/cli":"4.0.538","react":"18.3.1","react-dom":"18.3.1","remotion":"4.0.538"}}
          PACKAGE_JSON
          cat > mechanics.jsx <<'VIDEO_JSX'
          import React from 'react';
          import '@fontsource/noto-sans-sc/400.css';
          import {Composition,registerRoot,useCurrentFrame,useVideoConfig} from 'remotion';
          const K='#17212b',B='#276b9c';
          
          // 可调物理参数。国际单位制：kg、m、s、N、Pa。
          const P={JA:0.08,J1:0.02,J2:0.12,m:10,k:5000,r1:0.05,r2:0.10,a:0.04,L:0.8,d:0.010,G:80e9,M0:1};
          const kt=P.G*Math.PI*P.d**4/(32*P.L);
          const ratio=P.r1/P.r2;
          const je=P.J1+ratio**2*(P.J2+P.m*P.a**2);
          const ke=P.k*(P.a*ratio)**2;
          // 质量归一化的二阶系统：精确模态叠加，无时间积分漂移。
          const aa=kt/P.JA,bb=-kt/Math.sqrt(P.JA*je),dd=(kt+ke)/je;
          const disc=Math.hypot(aa-dd,2*bb);
          const eig=[(aa+dd+disc)/2,(aa+dd-disc)/2];
          const alpha=.5*Math.atan2(2*bb,aa-dd);
          const modes=[[Math.cos(alpha),Math.sin(alpha)],[-Math.sin(alpha),Math.cos(alpha)]];
          function response(time){
           let qa=0,q1=0,wa=0,w1=0,accA=0,acc1=0;
           modes.forEach((u,i)=>{
             const w=Math.sqrt(eig[i]);
             const c=u[0]*P.M0/Math.sqrt(P.JA)/eig[i];
             const q=c*(1-Math.cos(w*time)),v=c*w*Math.sin(w*time),acc=c*eig[i]*Math.cos(w*time);
             qa+=u[0]*q/Math.sqrt(P.JA);q1+=u[1]*q/Math.sqrt(je);
             wa+=u[0]*v/Math.sqrt(P.JA);w1+=u[1]*v/Math.sqrt(je);
             accA+=u[0]*acc/Math.sqrt(P.JA);acc1+=u[1]*acc/Math.sqrt(je);
           });
           const q2=-ratio*q1,x=P.a*q2,torque=kt*(qa-q1);
           return {qa,q1,q2,x,torque,stress:16*Math.abs(torque)/(Math.PI*P.d**3)/1e6,wa,w1,accA,acc1};
          }
          
          const text=(x,y,s,size=28,extra={})=><text x={x} y={y} fontSize={size} fill={K} {...extra}>{s}</text>;
          const line=(x1,y1,x2,y2,extra={})=><line x1={x1} y1={y1} x2={x2} y2={y2} stroke={K} strokeWidth="3" {...extra}/>;
          // Standard 20-degree involute flanks; root transitions remain schematic.
          function gearProfile(r,n){
           const pressure=20*Math.PI/180,module=2*r/n;
           const rb=r*Math.cos(pressure),ra=r+module,rf=r-1.25*module;
           const invPitch=Math.tan(pressure)-pressure,half=Math.PI/(2*n);
           const tmax=Math.sqrt((ra/rb)**2-1);
           const flankOffset=t=>half+invPitch-(t-Math.atan(t));
           const points=[],put=(rad,a)=>points.push([rad*Math.cos(a),rad*Math.sin(a)]);
           const pitch=2*Math.PI/n;
           for(let i=0;i<n;i++){
             const center=i*pitch;
             const base=flankOffset(0),tip=flankOffset(tmax);
             // Root arc -> left involute -> tip arc -> right involute -> root arc.
             for(let j=0;j<=6;j++)put(rf,center-pitch/2+(pitch/2-base)*j/6);
             put(rb,center-base);
             for(let j=1;j<=36;j++){const t=tmax*j/36;put(rb*Math.sqrt(1+t*t),center-flankOffset(t));}
             for(let j=1;j<=10;j++)put(ra,center-tip+2*tip*j/10);
             for(let j=35;j>=0;j--){const t=tmax*j/36;put(rb*Math.sqrt(1+t*t),center+flankOffset(t));}
             put(rf,center+base);
             for(let j=1;j<=6;j++)put(rf,center+base+(pitch/2-base)*j/6);
           }
           return points;
          }
          function rackProfile(){
           const module=2*64/20,pitch=Math.PI*module,pressure=20*Math.PI/180;
           const yPitch=605+64,root=yPitch+1.25*module,tip=yPitch-module;
           const hw=pitch/4,wide=hw+1.25*module*Math.tan(pressure),narrow=hw-module*Math.tan(pressure);
           const points=[[1090,root]];
           // At zero angle a pinion tooth points down into a rack space.
           for(let j=-8;j<=16;j++){
            const c=1260+(j+.5)*pitch;
            for(const p of [[c-wide,root],[c-narrow,tip],[c+narrow,tip],[c+wide,root]])points.push(p);
           }
           points.push([1660,703],[1090,703]);
           return points;
          }
          const GEAR_CACHE=new Map();
          function Gear({cx,cy,r,n,opacity=1}){
           const key=r+':'+n;
           if(!GEAR_CACHE.has(key))GEAR_CACHE.set(key,gearProfile(r,n).map(([x,y])=>[cx+x,cy+y].join(',')).join(' '));
           return <g opacity={opacity}><polygon points={GEAR_CACHE.get(key)} fill="none" stroke={K} strokeWidth="2.0" strokeLinejoin="round"/><circle cx={cx} cy={cy} r={r} fill="none" stroke={K} strokeWidth="0.8" strokeDasharray="8 7" strokeOpacity="0.5"/></g>;
          }
          function ArrowArc({cx,cy,r,a,b,label,lx,ly}){
           const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)];const s=p(a),e=p(b);
           return <g><path d={`M ${s} A ${r} ${r} 0 ${Math.abs(b-a)>Math.PI?1:0} ${b>a?0:1} ${e}`} stroke={B} strokeWidth="3" fill="none" markerEnd="url(#bluearrow)"/>{text(lx,ly,label,29,{fill:B})}</g>;
          }
          function Diagram(){
           const frame=useCurrentFrame(),{fps}=useVideoConfig();
           const videoTime=frame/fps;
           const time=Math.min(6,Math.max(0,(videoTime-3)*0.3));
           const v=response(time),shift=v.x*1600;
           const deg=angle=>-angle*180/Math.PI;
           let spring=[[1800+shift,710],[1820+shift,710]];
           for(let i=0;i<12;i++)spring.push([1830+shift+i*(121-shift)/11,i%2?728:692]);
           spring.push([1965,710],[1990,710]);
           const rotor=[1260,365],output=[1260,605];
           const mlabel=(x,y,value)=>text(x,y,value,19,{fill:'#647180',textAnchor:'middle'});
           return <svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080" style={{background:'white',fontFamily:'Noto Sans SC,sans-serif'}}>
           {text(960,69,'弹性传动 · 耦合振动',34,{textAnchor:'middle',fontWeight:500,letterSpacing:3})}
           {text(960,106,'GEAR  /  SHAFT  /  SPRING',14,{textAnchor:'middle',fill:'#89929d',letterSpacing:4})}
           {[[430,'物理时间',time.toFixed(2),'s'],
             [775,'滑块位移',(v.x*1000).toFixed(2),'mm'],
             [1135,'轴内扭矩',v.torque.toFixed(3),'N·m'],
             [1480,'最大剪应力',v.stress.toFixed(2),'MPa']].map(([x,label,value,unit])=><g key={label}>
               {text(x,173,label,19,{textAnchor:'middle',fill:'#89929d'})}
               <text x={x} y="221" textAnchor="middle" fill={B} fontSize="35" fontWeight="400">{value}<tspan dx="10" fontSize="17" fill="#647180">{unit}</tspan></text>
             </g>)}
           {/* The mechanism alone is enlarged and centred; no surrounding UI panels. */}
           <g transform="translate(-1092.5 -67.5) scale(1.35)">
             <g transform={`rotate(${deg(v.q1)} 1260 365)`}>
               <Gear cx={1260} cy={365} r={80} n={24}/>
               {line(1260,365,1320,365,{stroke:B,strokeWidth:2.2})}
               <circle cx="1320" cy="365" r="4" fill={B}/>
             </g>
             <g transform={`rotate(${deg(v.q2)} 1260 605)`}>
               <g transform="rotate(3.75 1260 605)"><Gear cx={1260} cy={605} r={160} n={48} opacity={0.42}/></g>
               <Gear cx={1260} cy={605} r={64} n={20}/>
               {line(1260,605,1260,455,{stroke:B,strokeWidth:1.8,strokeOpacity:.7})}
               <circle cx="1260" cy="455" r="4" fill={B}/>
             </g>
             {[365,605].map(y=><g key={y}><circle cx="1260" cy={y} r="7" fill="white" stroke={K} strokeWidth="2"/><circle cx="1260" cy={y} r="2.5" fill={K}/></g>)}
             {mlabel(1143,364,'θ₁')}
             {mlabel(1065,606,'θ₂')}
             <g transform={`translate(${shift} 0)`}>
               <defs><clipPath id="rackWindow"><rect x="1170" y="650" width="360" height="60"/></clipPath></defs>
               <g clipPath="url(#rackWindow)"><polygon points={rackProfile().map(p=>p.join(',')).join(' ')} fill="white" stroke={K} strokeWidth="1.8" strokeLinejoin="round"/></g>
               {line(1170,677,1170,703,{strokeWidth:1.8})}{line(1530,677,1530,703,{strokeWidth:1.8})}
               {line(1530,689,1585,689,{strokeWidth:2})}
               <rect x="1585" y="645" width="180" height="100" fill="white" stroke={K} strokeWidth="2"/>
               {text(1675,704,'m',26,{textAnchor:'middle',fill:'#647180'})}
             </g>
             {line(1765+shift,695,1800+shift,695,{strokeWidth:2})}
             {line(1800+shift,695,1800+shift,710,{strokeWidth:2})}
             <polyline points={spring.map(p=>p.join(',')).join(' ')} fill="none" stroke={K} strokeWidth="2.1" strokeLinejoin="round"/>
             {line(1990,664,1990,758,{strokeWidth:3})}
             {Array.from({length:6},(_,i)=>line(1990,671+15*i,2005,656+15*i,{strokeWidth:1}))}
             {line(1555,755,1785,755,{strokeWidth:1.5,stroke:'#89929d'})}
             {mlabel(1900,665,'k')}
             {mlabel(1675,620,'x →')}
           </g>
           {text(960,1029,videoTime<3?'初始静止 · 随后施加恒定驱动力矩':'M = 1.00 N·m    ·    慢放 × 0.30    ·    无阻尼',17,{textAnchor:'middle',fill:'#89929d'})}
           </svg>;
          }
          registerRoot(()=> <Composition id="Mechanics" component={Diagram} width={3840} height={2160} fps={120} durationInFrames={24*120}/>);
          VIDEO_JSX
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx remotion browser ensure
      - name: Render MP4
        env:
          VIDEO_FPS: ${{ inputs.frame_rate }}
        run: npx remotion render mechanics.jsx Mechanics out/mechanics.mp4 --codec=h264 --crf=18 --concurrency=1 --fps="$VIDEO_FPS" --duration="$((24 * VIDEO_FPS))"
      - name: Downloadable video
        uses: actions/upload-artifact@v4
        with:
          name: mechanics-animation-4k-${{ inputs.frame_rate }}fps
          path: out/mechanics.mp4
          retention-days: 3
          if-no-files-found: error
