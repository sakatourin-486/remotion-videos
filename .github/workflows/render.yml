返回<g不透明度={opacity}><circle cx={p[0]}cy={p[1]}r={5}填充={color}/>{label&&<text x={p[0]+偏移量[0]}y={p[1]+偏移量[1]}textAnchor="middle"fontSize={26}fill={color}>{label}</text>}</g>；
          }
// 半径和弧线都由同一个帧进度驱动，拖动时间轴或云端并行渲染也保持同步。
