<片段a={[V[0],V[1]+35]}b={[U[0],U[1]-35]}p={interval(t，12，0.7)}颜色={主题.柔和的}/>
{T>=12.7&&<点p={米}标签="M"偏移={[0，34]}/>}
<段a={米}b={T}p={区间(t，13，0.7)}颜色={主题蓝色}/>
<扫描中心={米}半径={机器翻译}开始={轴承(M，T)}t={t}开始={14.6}持续时间={2.8}/>
{T>=17.4&&<点p={N}标签="N"颜色={主题.黄色}/>}
</g>
