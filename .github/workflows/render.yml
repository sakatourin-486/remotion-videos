name: Render Franklin 4K60

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解压源码
        run: unzip -o franklin-remotion-source.zip

      - name: 安装依赖
        working-directory: franklin-motion
        run: npm ci

      - name: 安装渲染浏览器
        working-directory: franklin-motion
        run: npx remotion browser ensure

      - name: 渲染视频
        working-directory: franklin-motion
        run: npm run render -- --concurrency=2

      - name: 保存成片
        uses: actions/upload-artifact@v4
        with:
          name: Franklin-4K60
          path: franklin-motion/out/film.mp4
          if-no-files-found: error
